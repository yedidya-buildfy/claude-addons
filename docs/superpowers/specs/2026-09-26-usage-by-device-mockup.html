<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שימוש לפי מכשיר — עיצובים</title>
<style>
  :root {
    --bg: #f5f4f1; --card: #fff; --ink: #1c1b19; --muted: #6a665f; --faint: #8f8a82; --line: #e3dfd8;
    --accent: #c2410c; --accent-soft: #fdf1ea; --accent-ink: #fff; --ok: #15803d; --bad: #b91c1c; --warn: #a16207;
    --d1: #c2410c; --d2: #0e7490; --d3: #7c3aed;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151412; --card: #1f1d1a; --ink: #eeeae4; --muted: #a39e96; --faint: #7d786f; --line: #332f2a;
            --accent: #fb923c; --accent-soft: #2b1d12; --accent-ink: #1a0d04; --ok: #4ade80; --bad: #f87171; --warn: #facc15;
            --d1: #fb923c; --d2: #22d3ee; --d3: #a78bfa; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Arial Hebrew", sans-serif; }
  main { max-width: 780px; margin: 0 auto; padding: 28px 16px 80px; }
  .variants { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
  .variants button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px; padding: 4px 14px; cursor: pointer; }
  .variants button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .idea { color: var(--muted); font-size: 13px; margin: 0 4px 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .head { display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; }
  .head .text { flex: 1; }
  .title { font-weight: 600; font-size: 16px; }
  .summary { color: var(--muted); }
  .switch { width: 44px; height: 26px; border-radius: 999px; background: var(--accent); position: relative; flex: none; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; }
  .panel { border-top: 1px solid var(--line); padding: 14px 18px 16px; }
  .tag { font-size: 11px; font-weight: 500; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .muted { color: var(--muted); } .faint { color: var(--faint); }
  .num { font-variant-numeric: tabular-nums; }
  .name { border: 1px solid transparent; background: transparent; color: var(--ink); font: inherit; font-weight: 600; padding: 1px 4px; margin: -1px -4px; border-radius: 6px; width: 17ch; }
  .name:hover, .name:focus { border-color: var(--line); background: var(--bg); outline: none; }
  .stale { color: var(--warn); }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .foot input { width: 5ch; font: inherit; text-align: center; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); padding: 1px 2px; }
  .seg { max-width: 100%; overflow-x: auto; display: inline-flex; background: var(--bg); border-radius: 9px; padding: 3px; gap: 2px; }
  .seg button { white-space: nowrap; font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--muted); padding: 3px 12px; border-radius: 7px; cursor: pointer; }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px #0002; font-weight: 600; }
  .plan { display: flex; gap: 18px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .plan b { color: var(--ink); font-variant-numeric: tabular-nums; }

  /* A — table */
  .ta { width: 100%; border-collapse: collapse; font-size: 14px; }
  .ta th { text-align: start; font-weight: 600; color: var(--faint); font-size: 12px; padding: 4px 8px 6px; white-space: nowrap; }
  .ta th small { display: block; font-weight: 400; }
  .ta td { padding: 9px 8px; border-top: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ta tr.me td { background: var(--accent-soft); }
  .ta tr.me td:first-child { border-start-start-radius: 8px; border-end-start-radius: 8px; }
  .ta tr.me td:last-child { border-start-end-radius: 8px; border-end-end-radius: 8px; }
  .bar { display: inline-block; width: 34px; height: 6px; border-radius: 3px; margin-inline-end: 7px; vertical-align: middle;
         background: linear-gradient(to left, var(--accent) calc(var(--v) * 100%), var(--line) 0); }
  .scroll { overflow-x: auto; margin: 0 -8px; }

  /* B — device cards */
  .devs { display: grid; gap: 8px; margin-top: 12px; }
  .dev { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: center; }
  .dev.me { border-color: var(--accent); background: var(--accent-soft); }
  .dev .big { font-size: 28px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .dev .sub { font-size: 13px; color: var(--muted); }
  .dev .meter { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .dev .meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .dev .meter.plan-m { position: relative; height: 8px; }
  .dev .meter.plan-m i { position: absolute; inset-block: 0; inset-inline-start: 0; }
  .dev .meter.plan-m i.all { background: color-mix(in srgb, var(--accent) 28%, transparent); }
  .bigbox { text-align: end; }
  .dev .big small { font-size: 13px; font-weight: 500; color: var(--muted); margin-inline-start: 4px; letter-spacing: 0; }
  .dev .sub b { color: var(--ink); font-variant-numeric: tabular-nums; }

  /* C — stacked bars */
  .rows { display: grid; gap: 12px; margin-top: 4px; }
  .row { display: grid; grid-template-columns: 70px 1fr; gap: 12px; align-items: center; }
  .row .lbl { font-size: 13px; color: var(--muted); }
  .stack { display: flex; height: 26px; border-radius: 7px; overflow: hidden; background: var(--line); gap: 2px; }
  .stack span { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 0; overflow: hidden; }
  .row.plan-row .stack { background: var(--bg); border: 1px dashed var(--line); }
  .legend { display: grid; gap: 6px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
  .legend .it { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .legend .it .when { margin-inline-start: auto; font-size: 12px; }
  /* heatmap — every day, per device */
  .hm { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .hm-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .hm-head h3 { margin: 0; font-size: 14px; }
  .hm-scale { display: flex; align-items: center; gap: 3px; font-size: 12px; color: var(--faint); }
  .hm-devs { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .hm-dev { display: grid; gap: 6px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; justify-items: center; }
  .hm-dev.me { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .hm-name { justify-self: stretch; display: flex; justify-content: space-between; gap: 8px; font-size: 13px; flex-wrap: wrap; }
  .hm-name b { font-weight: 600; }
  .hm-wrap { direction: ltr; display: grid; grid-template-columns: auto auto; gap: 6px; }
  .hm-days { display: grid; grid-template-rows: repeat(7, 11px); gap: 3px; font-size: 10px; color: var(--faint); direction: rtl; }
  .hm-days span { line-height: 11px; }
  .hm-grid { display: grid; grid-template-rows: repeat(7, 11px); grid-auto-flow: column; grid-auto-columns: 11px; gap: 3px; }
  .hm-months { direction: ltr; display: grid; grid-auto-flow: column; grid-auto-columns: 14px; font-size: 10px; color: var(--faint); height: 13px; padding-left: 22px; white-space: nowrap; }
  .sq { width: 11px; height: 11px; border-radius: 3px; background: var(--line); }
  .sq.l1 { background: color-mix(in srgb, var(--accent) 25%, var(--line)); }
  .sq.l2 { background: color-mix(in srgb, var(--accent) 50%, var(--line)); }
  .sq.l3 { background: color-mix(in srgb, var(--accent) 75%, var(--line)); }
  .sq.l4 { background: var(--accent); }
  .sq.pad { visibility: hidden; }
  .sq:hover { outline: 2px solid var(--ink); outline-offset: 1px; }
  #tip { line-height: 1.6; position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 5px 9px; border-radius: 7px; white-space: nowrap; display: none; z-index: 10; }
  /* daily views */
  .dv { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .dv-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .dv-head h3 { margin: 0; font-size: 14px; }
  .lg { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .lg span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex: none; }
  /* bars */
  .bars { direction: ltr; display: grid; grid-template-columns: auto 1fr; gap: 6px; }
  .yax { display: flex; flex-direction: column; justify-content: space-between; font-size: 10px; color: var(--faint); text-align: right; height: 160px; }
  .plot { position: relative; height: 160px; display: flex; align-items: flex-end; gap: 3px; border-bottom: 1px solid var(--line);
          background: repeating-linear-gradient(to top, transparent 0 39px, var(--line) 39px 40px); }
  .col { flex: 1; display: flex; flex-direction: column-reverse; min-width: 0; border-radius: 3px 3px 0 0; overflow: hidden; cursor: default; }
  .col:hover { outline: 2px solid var(--ink); outline-offset: 1px; }
  .col i { display: block; }
  .xax { grid-column: 2; display: flex; gap: 3px; font-size: 10px; color: var(--faint); }
  .xax span { flex: 1; text-align: center; min-width: 0; white-space: nowrap; }
  /* calendar */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .wd { font-size: 11px; color: var(--faint); text-align: center; padding-bottom: 2px; }
  .cell { border: 1px solid var(--line); border-radius: 8px; padding: 5px 6px; min-height: 58px; display: flex; flex-direction: column; gap: 3px; font-size: 11px; }
  .cell.out { visibility: hidden; }
  .cell.today { border-color: var(--accent); }
  .cell .d { color: var(--faint); }
  .cell .amt { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 12px; }
  .split { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--line); margin-top: auto; }
  .cal-nav { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
  .cal-nav button { border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 6px; padding: 0 8px; font: inherit; cursor: pointer; }
  /* day table */
  .dt { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  .dt th { font-size: 12px; color: var(--faint); font-weight: 600; text-align: start; padding: 4px 6px; white-space: nowrap; }
  .dt td { padding: 6px; border-top: 1px solid var(--line); white-space: nowrap; }
  .dt .cellbar { display: inline-block; height: 6px; border-radius: 3px; vertical-align: middle; margin-inline-end: 6px; }
  .dt tr.wkend td { color: var(--faint); }
</style>
</head>
<body>
<div id="tip"></div>
<main>
  <div class="variants" id="tabs"></div>
  <p class="idea" id="idea"></p>
  <section class="card">
    <div class="head"><div class="text">
      <div class="title">שימוש לפי מכשיר</div>
      <div class="summary">כמה כל מחשב על אותו מנוי קלוד ניצל: היום, 7 ימים, 30 ימים, החודש, 5 השעות והשבוע.</div>
    </div><span class="switch"></span></div>
    <div class="panel" id="panel"></div>
  </section>
</main>
<script>
const PLAN = { five: 57, week: 80, today: null, d7: null, d30: null, month: null };
const DEVICES = [
  { id: "a", name: "MacBook Pro של ידידיה", me: true, ago: "עכשיו", stale: false, p: { today: [.81, 42.1], d7: [.66, 188.4], d30: [.61, 610.2], month: [.63, 540.8] }, w: { five: 46.2, week: 40 } },
  { id: "b", name: "המחשב של דנה", ago: "לפני 12 דק׳", stale: false, p: { today: [.19, 9.9], d7: [.27, 77.1], d30: [.29, 290.0], month: [.28, 240.3] }, w: { five: 10.8, week: 36 } },
  { id: "c", name: "Mac mini במשרד", ago: "לפני יומיים", stale: true, p: { today: [0, 0], d7: [.07, 20.0], d30: [.10, 100.0], month: [.09, 77.2] }, w: { five: 0, week: 4 } },
];
const COLORS = ["var(--d1)", "var(--d2)", "var(--d3)"];
const PERIODS = [["today", "היום"], ["d7", "7 ימים"], ["d30", "30 ימים"], ["month", "החודש"]];
const pct = (x) => `${Math.round(x * 100)}%`;
const name = (d) => `<input class="name" value="${d.name}" maxlength="40" aria-label="שם המכשיר">`;
const foot = () => `<div class="foot"><span>שמור עדכונים בתיבת הדואר ל־<input type="number" dir="ltr" min="12" max="168" value="72"> שעות</span><span class="faint">לחץ על שם כדי לשנות אותו</span></div>`;
let period = "week";

const TABS = [["five", "5 שעות"], ["week", "שבוע"], ...PERIODS];
const V = {
  B: { label: "כרטיס לכל מכשיר", idea: "5 שעות / שבוע: המספר הגדול = כמה מהמנוי המכשיר ניצל, ולידו החלק שלו מתוך השימוש בפועל (מנורמל ל-100%). הפס = כל המנוי; החלק הצבוע בכהה = המכשיר.",
    html: () => {
      const plan = PLAN[period];
      return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <div class="seg">${TABS.map(([k, l]) => `<button data-p="${k}" class="${k === period ? "on" : ""}">${l}</button>`).join("")}</div>
      ${plan != null ? `<div class="plan"><span>נוצל במנוי: <b>${plan}%</b></span></div>` : ""}</div>
      <div class="devs">${DEVICES.map((d) => {
        const share = plan != null ? (plan ? d.w[period] / plan : 0) : d.p[period][0];
        const big = plan != null ? `${Math.round(d.w[period])}%` : pct(share);
        const bigSub = plan != null ? "מהמנוי" : "מהשימוש";
        const second = plan != null ? `<b>${pct(share)}</b> מהשימוש בפועל` : `≈ $${d.p[period][1]}`;
        const meter = plan != null
          ? `<div class="meter plan-m"><i class="all" style="width:${plan}%"></i><i style="width:${d.w[period]}%"></i></div>`
          : `<div class="meter"><i style="width:${share * 100}%"></i></div>`;
        return `<div class="dev ${d.me ? "me" : ""}">
          <div><i class="dot" style="background:${COLORS[DEVICES.indexOf(d)]}"></i> ${name(d)} ${d.me ? '<span class="tag">המחשב הזה</span>' : ""}<div class="sub"><span class="${d.stale ? "stale" : ""}">עודכן ${d.ago}</span></div></div>
          <div class="bigbox"><div class="big">${big}<small>${bigSub}</small></div><div class="sub">${second}</div></div>
          ${meter}</div>`;
      }).join("")}</div>${daily()}${foot()}`;
    } },
};

// ---- heatmap demo data: 13 weeks, one number per day per device
const WEEKS = 13, today = new Date(2026, 8, 26);
const dayList = []; // oldest → newest, starting on a Sunday
const start = new Date(today); start.setDate(start.getDate() - start.getDay() - (WEEKS - 1) * 7);
for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) dayList.push(new Date(d));
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const HM = DEVICES.map((dev, i) => dayList.map((d) => {
  const weekend = d.getDay() === 5 || d.getDay() === 6;
  const base = [38, 22, 6][i], r = rnd();
  if (i === 2 && r < .7) return 0;
  if (weekend && r < .6) return 0;
  return +(base * (weekend ? .3 : 1) * (.2 + r * 1.4)).toFixed(2);
}));
const all = HM.flat().filter((x) => x > 0).sort((a, b) => a - b);
const q = [.25, .5, .75].map((k) => all[Math.floor(all.length * k)]);
const level = (w) => (!w ? "" : w <= q[0] ? "l1" : w <= q[1] ? "l2" : w <= q[2] ? "l3" : "l4");
const HE_DAYS = ["א׳", "", "ג׳", "", "ה׳", "", "ש׳"];
const MONTHS = ["ינו׳", "פבר׳", "מרץ", "אפר׳", "מאי", "יוני", "יולי", "אוג׳", "ספט׳", "אוק׳", "נוב׳", "דצמ׳"];
function heatmap() {
  const months = []; let last = -1;
  for (let w = 0; w < Math.ceil(dayList.length / 7); w++) { const m = dayList[w * 7].getMonth(); const li = months.map(Boolean).lastIndexOf(true), gap = li < 0 ? 99 : months.length - li; months.push(m !== last && gap > 2 ? MONTHS[m] : ""); if (m !== last && gap > 2) last = m; else if (m !== last) last = m; }
  return `<div class="hm"><div class="hm-head"><h3>כל יום, 13 שבועות אחרונים</h3>
    <div class="hm-scale">פחות <span class="sq"></span><span class="sq l1"></span><span class="sq l2"></span><span class="sq l3"></span><span class="sq l4"></span> יותר</div></div>
    <div class="hm-devs">${DEVICES.map((dev, i) => {
      const total = HM[i].reduce((a, b) => a + b, 0), active = HM[i].filter(Boolean).length;
      return `<div class="hm-dev ${dev.me ? "me" : ""}"><div class="hm-name"><b>${dev.name}${dev.me ? ' <span class="tag">המחשב הזה</span>' : ""}</b><span class="faint">${active} ימים פעילים · <bdi dir="ltr">≈ $${Math.round(total)}</bdi></span></div>
        <div class="hm-months">${months.map((m) => `<span>${m}</span>`).join("")}</div>
        <div class="hm-wrap"><div class="hm-days">${HE_DAYS.map((d) => `<span>${d}</span>`).join("")}</div>
        <div class="hm-grid">${dayList.map((d, j) => `<span class="sq ${level(HM[i][j])}" data-i="${i}" data-j="${j}"></span>`).join("")}</div></div></div>`;
    }).join("")}</div></div>`;
}

// ---- daily views: last 30 days, each device in its own color (same colors as the dots on the cards)
const LAST = 30, days30 = dayList.slice(-LAST), D30 = HM.map((row) => row.slice(-LAST));
const dayTot = (j) => D30.reduce((a, r) => a + r[j], 0);
const money = (x) => `<bdi dir="ltr">≈ $${Math.round(x)}</bdi>`;
const legend = () => `<div class="lg">${DEVICES.map((d, i) => `<span><i class="dot" style="background:${COLORS[i]}"></i>${d.name}</span>`).join("")}</div>`;
let dview = "bars";
const DV = {
  bars: ["עמודות", () => {
    const max = Math.max(...days30.map((_, j) => dayTot(j))), top = Math.ceil(max / 20) * 20;
    return `<div class="bars"><div class="yax">${[4, 3, 2, 1, 0].map((k) => `<span>$${(top / 4) * k}</span>`).join("")}</div>
      <div class="plot">${days30.map((d, j) => `<div class="col" data-day="${j}" style="height:${(dayTot(j) / top) * 100}%">${DEVICES.map((_, i) => D30[i][j] ? `<i style="flex:${D30[i][j]};background:${COLORS[i]}"></i>` : "").join("")}</div>`).join("")}</div>
      <div class="xax">${days30.map((d, j) => `<span>${j === LAST - 1 ? "היום" : (LAST - 1 - j) % 7 === 0 ? `${d.getDate()}.${d.getMonth() + 1}` : ""}</span>`).join("")}</div></div>`;
  }],
  cal: ["לוח שנה", () => {
    const first = new Date(today.getFullYear(), today.getMonth(), 1), n = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
    const cells = [];
    for (let k = 0; k < first.getDay(); k++) cells.push(`<div class="cell out"></div>`);
    for (let dd = 1; dd <= n; dd++) {
      const j = days30.findIndex((x) => x.getMonth() === today.getMonth() && x.getDate() === dd);
      const tot = j >= 0 ? dayTot(j) : 0, future = dd > today.getDate();
      cells.push(`<div class="cell ${dd === today.getDate() ? "today" : ""}" ${j >= 0 ? `data-day="${j}"` : ""}><span class="d">${dd}</span>
        ${future ? "" : tot ? `<span class="amt">${money(tot)}</span><span class="split">${DEVICES.map((_, i) => D30[i][j] ? `<i style="flex:${D30[i][j]};background:${COLORS[i]}"></i>` : "").join("")}</span>` : `<span class="faint">—</span>`}</div>`);
    }
    return `<div class="cal-nav"><button>›</button>ספטמבר 2026<button>‹</button></div><div class="cal" style="margin-top:8px">${["א׳", "ב׳", "ג׳", "ד׳", "ה׳", "ו׳", "ש׳"].map((w) => `<div class="wd">${w}</div>`).join("")}${cells.join("")}</div>`;
  }],
  table: ["טבלה", () => {
    const max = Math.max(...D30.flat());
    return `<div class="scroll"><table class="dt"><thead><tr><th>יום</th>${DEVICES.map((d, i) => `<th><i class="dot" style="background:${COLORS[i]}"></i> ${d.name}</th>`).join("")}<th>סה״כ</th></tr></thead><tbody>
      ${days30.slice(-14).map((d, k) => { const j = LAST - 14 + k; return { d, j }; }).reverse().map(({ d, j }) => `<tr class="${d.getDay() >= 5 ? "wkend" : ""}" data-day="${j}"><td>${d.toLocaleDateString("he-IL", { weekday: "short", day: "numeric", month: "numeric" })}</td>
        ${DEVICES.map((_, i) => `<td>${D30[i][j] ? `<span class="cellbar" style="width:${(D30[i][j] / max) * 60}px;background:${COLORS[i]}"></span>${money(D30[i][j])}` : '<span class="faint">—</span>'}</td>`).join("")}
        <td><b>${money(dayTot(j))}</b></td></tr>`).join("")}</tbody></table></div>`;
  }],
};
function daily() {
  return `<div class="dv"><div class="dv-head"><h3>כל יום, מי השתמש כמה</h3><div class="seg">${Object.entries(DV).map(([k, [l]]) => `<button data-dv="${k}" class="${k === dview ? "on" : ""}">${l}</button>`).join("")}</div></div>
    ${legend()}<div style="margin-top:12px">${DV[dview][1]()}</div></div>`;
}
const tip = document.getElementById("tip");
document.addEventListener("mouseover", (e) => {
  const dayEl = e.target.closest?.("[data-day]");
  if (dayEl) {
    const j = +dayEl.dataset.day, tot = dayTot(j);
    tip.innerHTML = `<b>${days30[j].toLocaleDateString("he-IL", { weekday: "long", day: "numeric", month: "numeric" })}</b> · ${money(tot)}<br>${DEVICES.map((d, i) => D30[i][j] ? `<i class="dot" style="background:${COLORS[i]}"></i> ${d.name}: ${Math.round((D30[i][j] / tot) * 100)}%` : "").filter(Boolean).join("<br>") || "אף אחד לא השתמש"}`;
    const r = dayEl.getBoundingClientRect();
    tip.style.display = "block"; tip.style.left = `${Math.min(innerWidth - tip.offsetWidth - 8, Math.max(8, r.left + r.width / 2 - tip.offsetWidth / 2))}px`; tip.style.top = `${r.top - tip.offsetHeight - 8}px`;
    return;
  }
  const { i, j } = e.target.dataset || {};
  if (i === undefined || j === undefined) { tip.style.display = "none"; return; }
  const w = HM[i][j], dayTotal = HM.reduce((a, row) => a + row[j], 0), d = dayList[j];
  tip.innerHTML = `${d.toLocaleDateString("he-IL", { weekday: "long", day: "numeric", month: "numeric" })} · ${DEVICES[i].name}<br>${w ? `<bdi dir="ltr">≈ $${w}</bdi> · ${Math.round((w / dayTotal) * 100)}% מהשימוש באותו יום` : "לא השתמש"}`;
  const r = e.target.getBoundingClientRect();
  tip.style.display = "block"; tip.style.left = `${Math.max(8, r.left + r.width / 2 - tip.offsetWidth / 2)}px`; tip.style.top = `${r.top - tip.offsetHeight - 8}px`;
});
let cur = "B";
function draw() {
  document.getElementById("tabs").innerHTML = Object.entries(V).map(([k, v]) => `<button data-v="${k}" class="${k === cur ? "on" : ""}">${k} · ${v.label}</button>`).join("");
  document.getElementById("idea").textContent = V[cur].idea;
  document.getElementById("panel").innerHTML = V[cur].html();
}
document.addEventListener("click", (e) => {
  if (e.target.dataset.v) { cur = e.target.dataset.v; draw(); }
  if (e.target.dataset.p) { period = e.target.dataset.p; draw(); }
  if (e.target.dataset.dv) { dview = e.target.dataset.dv; draw(); }
});
draw();
</script>
</body>
</html>
