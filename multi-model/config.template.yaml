# CLIProxyAPI — local multi-model bridge for Claude Code.
# Installed by the claude-addons "multi-model" addon to
#   $(brew --prefix)/etc/cliproxyapi.conf
# __LOCAL_KEY__ is replaced with a freshly generated random key at install time.

host: "127.0.0.1"          # loopback only — never expose this proxy
port: 8317
auth-dir: "~/.cli-proxy-api"

api-keys:
  - "__LOCAL_KEY__"

remote-management:
  allow-remote: false
  secret-key: ""           # empty = management API fully disabled

debug: false
logging-to-file: true
usage-statistics-enabled: false

# Claude Code already retries transient failures. Retrying here as well turns one
# quota error into a long silent wait and a burst of duplicate requests.
request-retry: 0
max-retry-interval: 30

# Never park a login after a quota/usage 429. A manual reset on the provider
# side is invisible to the proxy, so a remembered cooldown can block a login
# that already works again. Return the error immediately to Claude Code instead.
disable-cooling: true

# A 400 from Gemini (bad tool shape) is a request problem, not a sick login.
# Do not park the only Grok/Gemini credential in cooldown for that.
oauth-request-scoped-errors:
  antigravity:
    - status: 400
      match:
        - "only allowed for OBJECT type"
        - "INVALID_ARGUMENT"
      action: "stop"
  xai:
    - status: 400
      match:
        - "only allowed for OBJECT type"
        - "INVALID_ARGUMENT"
      action: "stop"

quota-exceeded:
  switch-project: true

routing:
  strategy: "round-robin"
  session-affinity: true   # keep one conversation on one account

streaming:
  keepalive-seconds: 15

# Keep gateway ids looking like claude-* so /model lists Gemini and Grok.
# Claude Code 2.1.x drops ids that are not short claude-* tokens.
claude-code:
  disable-cloaking-model-list: false

oauth-model-alias:
  antigravity:
    - name: "gemini-3.8-flash-high"
      alias: "claude-gemini-flash"
      display-name: "Gemini 3.8 Flash"
      force-mapping: true
    - name: "gemini-3.7-flash-high"
      alias: "claude-gemini-37-flash"
      display-name: "Gemini 3.7 Flash"
      force-mapping: true
    - name: "gemini-pro-agent"
      alias: "claude-gemini-pro"
      display-name: "Gemini 3.1 Pro"
      force-mapping: true
  xai:
    - name: "grok-4.6"
      alias: "claude-grok-46"
      display-name: "Grok 4.6"
      force-mapping: true
  codex:
    - name: "gpt-5.6-sol"
      alias: "claude-gpt-sol"
      display-name: "GPT 5.6 Sol"
      force-mapping: true
    - name: "gpt-5.6-terra"
      alias: "claude-gpt-terra"
      display-name: "GPT 5.6 Terra"
      force-mapping: true
    - name: "gpt-5.6-luna"
      alias: "claude-gpt-luna"
      display-name: "GPT 5.6 Luna"
      force-mapping: true

# The exclusion list that keeps the model menu to the current generation is
# generated by `ccx --refresh` and appended below. Do not hand-edit it.
