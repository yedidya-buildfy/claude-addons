# CLIProxyAPI — local multi-model bridge for Claude Code.
# Installed by the claude-addons "multi-model" addon to
#   $(brew --prefix)/etc/cliproxyapi.conf
# __LOCAL_KEY__ is replaced with a freshly generated random key at install time.

host: "127.0.0.1"          # loopback only — never expose this proxy
port: 8317
auth-dir: "~/.cli-proxy-api"

api-keys:
  - "__LOCAL_KEY__"

remote-management:
  allow-remote: false
  secret-key: ""           # empty = management API fully disabled

debug: false
logging-to-file: true
usage-statistics-enabled: false

request-retry: 3
max-retry-interval: 30

quota-exceeded:
  switch-project: true

routing:
  strategy: "round-robin"
  session-affinity: true   # keep one conversation on one account

streaming:
  keepalive-seconds: 15

# The exclusion list that keeps the model menu to the current generation is
# generated by `ccx --refresh` and appended below. Do not hand-edit it.
