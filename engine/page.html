<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תוספים לקלוד</title>
<style>
  :root {
    --bg: #f5f4f1; --card: #fff; --ink: #1c1b19; --muted: #6a665f; --faint: #8f8a82; --line: #e3dfd8;
    --accent: #c2410c; --accent-soft: #fdf1ea; --accent-ink: #fff; --ok: #15803d; --bad: #b91c1c; --warn: #a16207;
    --u1: #c2410c; --u2: #0e7490; --u3: #7c3aed; --u4: #15803d; --u5: #a16207;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151412; --card: #1f1d1a; --ink: #eeeae4; --muted: #a39e96; --faint: #7d786f; --line: #332f2a;
            --accent: #fb923c; --accent-soft: #2b1d12; --accent-ink: #1a0d04; --ok: #4ade80; --bad: #f87171; --warn: #facc15;
            --u1: #fb923c; --u2: #22d3ee; --u3: #a78bfa; --u4: #4ade80; --u5: #facc15; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Arial Hebrew", sans-serif; }
  main { max-width: 780px; margin: 0 auto; padding: 36px 16px 140px; }
  header h1 { font-size: 26px; margin: 0; letter-spacing: -.01em; }
  header p { color: var(--muted); margin: 4px 0 0; }
  h2 { font-size: 13px; font-weight: 600; color: var(--faint); margin: 30px 4px 8px; letter-spacing: .02em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 8px; transition: border-color .15s; }
  .card.changed { border-color: var(--accent); }
  .head { display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; }
  .head .text { flex: 1; min-width: 0; }
  .title { font-weight: 600; font-size: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .summary { color: var(--muted); margin-top: 2px; }
  .tag { font-size: 12px; font-weight: 500; color: var(--muted); background: var(--bg); border-radius: 999px; padding: 1px 9px; }
  .tag.pending { color: var(--accent); background: var(--accent-soft); }
  .drift { color: var(--warn); font-size: 13px; margin-top: 6px; }
  details { border-top: 1px solid var(--line); }
  summary { cursor: pointer; padding: 9px 18px; color: var(--muted); font-size: 14px; list-style: none; user-select: none; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "‹"; display: inline-block; width: 14px; transition: transform .15s; }
  details[open] summary::before { transform: rotate(-90deg); }
  summary:hover { color: var(--ink); }
  .more { padding: 0 18px 16px 18px; display: grid; gap: 12px; }
  .more ul { margin: 0; padding-inline-start: 18px; }
  .more li { margin: 3px 0; }
  .more h3 { font-size: 13px; color: var(--faint); margin: 0 0 4px; font-weight: 600; }
  .more .check { background: var(--bg); border-radius: 10px; padding: 8px 12px; }
  .ltr { direction: ltr; unicode-bidi: isolate; font: 13px ui-monospace, Menlo, monospace; }
  .touch li { color: var(--muted); font-size: 14px; }
  .settings { border-top: 1px solid var(--line); padding: 12px 18px 14px; display: grid; gap: 10px; }
  .settings label { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; cursor: pointer; }
  .settings .field { flex: 1; min-width: 200px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line);
                     background: var(--bg); color: var(--ink); font: 14px ui-monospace, Menlo, monospace; direction: ltr; }
  /* switch */
  .switch { position: relative; width: 44px; height: 26px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .15s; }
  .switch span::after { content: ""; position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%;
                        background: #fff; box-shadow: 0 1px 2px #0003; transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(-18px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .switch.small { width: 36px; height: 22px; }
  .switch.small span::after { width: 16px; height: 16px; }
  .switch.small input:checked + span::after { transform: translateX(-14px); }
  button { font: inherit; border-radius: 9px; padding: 8px 16px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  .bar { position: fixed; inset: auto 0 0 0; background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(8px);
         border-top: 1px solid var(--line); padding: 12px 16px; }
  .bar .inner { max-width: 780px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .bar .msg { flex: 1; color: var(--muted); }
  #result { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; margin-top: 20px; display: none; }
  #result pre { white-space: pre-wrap; margin: 8px 0 0; direction: ltr; text-align: left; font: 13px/1.6 ui-monospace, Menlo, monospace; color: var(--muted); }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .kinds { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .kind { font-size: 12px; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 0 7px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 0 -18px; padding: 0 14px; overflow-x: auto; }
  .tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 7px 10px; color: var(--muted); white-space: nowrap; font-size: 14px; }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .pane { padding-top: 12px; display: grid; gap: 14px; }
  table.legend { border-collapse: collapse; width: 100%; }
  table.legend td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.legend td:first-child { width: 36px; font-size: 18px; text-align: center; }
  .doc { font-size: 14px; line-height: 1.7; max-height: 560px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; padding: 4px 16px; }
  .doc h1 { font-size: 19px; } .doc h2 { font-size: 16px; color: var(--ink); margin: 18px 0 6px; } .doc h3 { font-size: 14px; color: var(--ink); }
  .doc pre { background: var(--bg); border-radius: 8px; padding: 10px 12px; overflow-x: auto; direction: ltr; text-align: left; font: 12.5px/1.55 ui-monospace, Menlo, monospace; }
  .doc code { font: 12.5px ui-monospace, Menlo, monospace; background: var(--bg); border-radius: 4px; padding: 0 4px; direction: ltr; unicode-bidi: isolate; }
  .doc pre code { background: none; padding: 0; }
  .doc table { border-collapse: collapse; margin: 8px 0; } .doc th, .doc td { border: 1px solid var(--line); padding: 4px 8px; text-align: start; }
  .doc blockquote { margin: 8px 0; padding: 2px 12px; border-inline-start: 3px solid var(--line); color: var(--muted); }
  .doc :is(p, li, h1, h2, h3, h4, td, th, blockquote) { unicode-bidi: plaintext; text-align: start; }
  .front { background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; margin: 10px 0; font-size: 13.5px; }
  .front b { display: block; color: var(--accent); font-size: 12px; margin-bottom: 2px; }
  .docbar { display: flex; gap: 10px; align-items: center; color: var(--faint); font-size: 13px; flex-wrap: wrap; }
  .files li { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 4px 0; }
  button.link { border: 0; background: none; color: var(--accent); padding: 0 4px; font-size: 13px; }
  /* usage-by-device: one card per machine */
  .usage { border-top: 1px solid var(--line); padding: 14px 18px 16px; }
  .u-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .u-seg { display: inline-flex; background: var(--bg); border-radius: 9px; padding: 3px; gap: 2px; max-width: 100%; overflow-x: auto; }
  .u-seg button { white-space: nowrap; font-size: 13px; border: 0; background: transparent; color: var(--muted); padding: 3px 12px; border-radius: 7px; }
  .u-seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px #0002; font-weight: 600; }
  .u-plan { font-size: 13px; color: var(--muted); } .u-plan b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .u-devs { display: grid; gap: 8px; margin-top: 12px; }
  .u-dev { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: center; }
  .u-dev.me { border-color: var(--accent); background: var(--accent-soft); }
  .u-big { font-size: 28px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; text-align: end; }
  .u-big small { font-size: 13px; font-weight: 500; color: var(--muted); margin-inline-start: 4px; letter-spacing: 0; }
  .u-sub { font-size: 13px; color: var(--muted); } .u-sub b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .u-end { text-align: end; } .u-end .u-sub { white-space: nowrap; }
  .u-meter { grid-column: 1 / -1; position: relative; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .u-meter i { position: absolute; inset-block: 0; inset-inline-start: 0; background: var(--accent); border-radius: 4px; }
  .u-meter i.all { background: color-mix(in srgb, var(--accent) 28%, transparent); }
  .u-name { border: 1px solid transparent; background: transparent; color: var(--ink); font: inherit; font-weight: 600; padding: 1px 4px; margin: -1px -4px; border-radius: 6px; width: 17ch; max-width: 100%; }
  .u-name:hover, .u-name:focus { border-color: var(--line); background: var(--bg); outline: none; }
  .u-stale { color: var(--warn); }
  .u-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .u-foot input { width: 5ch; font: inherit; text-align: center; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); padding: 1px 2px; }
  .u-who { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; }
  .u-who .u-name { width: 17ch; min-width: 0; flex: 1; }
  .u-dot { flex: none; width: 9px; height: 9px; border-radius: 3px; display: inline-block; vertical-align: middle; margin-inline-end: 2px; }
  .u-daily { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .u-daily h3 { margin: 0 0 8px; font-size: 14px; color: var(--ink); }
  .u-lg { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .u-chart { direction: ltr; display: grid; grid-template-columns: auto 1fr; gap: 6px; }
  .u-y { display: flex; flex-direction: column; justify-content: space-between; font-size: 10px; color: var(--faint); text-align: right; height: 160px; font-variant-numeric: tabular-nums; }
  .u-plot { height: 160px; display: flex; align-items: flex-end; gap: 3px; border-bottom: 1px solid var(--line);
            background: repeating-linear-gradient(to top, transparent 0 39px, var(--line) 39px 40px); }
  .u-col { flex: 1; min-width: 0; display: flex; flex-direction: column-reverse; border-radius: 3px 3px 0 0; overflow: hidden; }
  .u-col:hover { outline: 2px solid var(--ink); outline-offset: 1px; }
  .u-col i { display: block; }
  .u-x { grid-column: 2; display: flex; gap: 3px; font-size: 10px; color: var(--faint); }
  .u-x span { flex: 1; min-width: 0; text-align: center; white-space: nowrap; }
  #u-tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; line-height: 1.6; padding: 5px 9px; border-radius: 7px; white-space: nowrap; display: none; z-index: 10; }
</style>
</head>
<body>
<div id="u-tip"></div>
<main>
  <header>
    <h1>תוספים לקלוד</h1>
    <p id="count">טוען…</p>
  </header>
  <div id="result" role="status"></div>
  <div id="list"></div>
</main>
<div class="bar"><div class="inner">
  <span class="msg" id="msg">אין שינויים</span>
  <button id="reset" disabled>בטל</button>
  <button id="save" class="primary" disabled>שמור</button>
</div></div>
<script>
const T = "__TOKEN__";
const GROUPS = ["טרמינל", "קלוד", "סקילים", "התראות", "מערכת", "אחר"];
const api = async (p, body, query = {}) => {
  const r = await fetch(p + "?" + new URLSearchParams({ t: T, ...query }), body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
let saved = [], draft = {}, open = new Set();
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// commands and paths read left-to-right inside Hebrew text
const code = (s) => String(s).split(/((?:~\/|\.\/)?[A-Za-z][\w.~\/-]*(?: (?:--?[\w-]+|<[^>]+>|[\w.~\/-]+))*)/g)
  .map((m, i) => i % 2 && /[a-z]/.test(m) && m.length > 2 ? `<span class="ltr">${esc(m)}</span>` : esc(m)).join("");

const snapshot = (list) => Object.fromEntries(list.map((a) => [a.id, { on: a.on, settings: Object.fromEntries(a.settings.map((s) => [s.key, s.value])) }]));
const dirty = () => { const b = snapshot(saved); return Object.keys(draft).filter((id) => JSON.stringify(draft[id]) !== JSON.stringify(b[id])); };

function card(a, byId, changed) {
  const d = draft[a.id];
  const needs = a.requires.map((r) => byId[r]?.title || r);
  const settings = d.on && (a.settings.length || a.actions.length) ? `<div class="settings">${
    a.settings.map((s) => s.type === "bool"
      ? `<label><span class="switch small"><input type="checkbox" data-set="${a.id}:${s.key}" ${d.settings[s.key] ? "checked" : ""}><span></span></span>${esc(s.label)}</label>`
      : `<label>${esc(s.label)}<input class="field" type="text" data-set="${a.id}:${s.key}" value="${esc(d.settings[s.key] ?? "")}" placeholder="ייווצר לבד בשמירה"></label>`).join("")
  }${a.actions.map((x) => `<div><button data-action="${a.id}:${x.id}">${esc(x.label)}</button> <span data-out="${a.id}:${x.id}"></span></div>`).join("")}</div>` : "";
  return `<section class="card ${changed.has(a.id) ? "changed" : ""}">
    <div class="head">
      <div class="text">
        <div class="title">${esc(a.title)}
          ${a.required ? '<span class="tag">תמיד פעיל</span>' : ""}
          ${needs.length ? `<span class="tag">צריך: ${esc(needs.join(", "))}</span>` : ""}
          ${changed.has(a.id) ? '<span class="tag pending">לא נשמר</span>' : ""}</div>
        <div class="summary">${code(a.summary)}</div>
        ${a.kinds.length ? `<div class="kinds">${a.kinds.map((k) => `<span class="kind">${esc(k)}</span>`).join("")}</div>` : ""}
        ${a.drift.length ? `<div class="drift">⚠ שונה ידנית או חסר: <span class="ltr">${esc(a.drift.join(", "))}</span></div>` : ""}
      </div>
      ${a.required ? "" : `<span class="switch"><input type="checkbox" aria-label="${esc(a.title)}" data-on="${a.id}" ${d.on ? "checked" : ""}><span></span></span>`}
    </div>
    ${settings}
    ${a.panel && d.on ? usagePanel(a) : ""}
    <details data-id="${a.id}" ${open.has(a.id) ? "open" : ""}>
      <summary>פרטים</summary>
      <div class="more">${panel(a)}</div>
    </details>
  </section>`;
}

// the inside of "פרטים": an overview, then each readable document, then the files
const tab = {}, docCache = {};
function panel(a) {
  const tabs = [["overview", "סקירה"], ...a.docs.map((d) => [d.id, d.label]), ["files", "קבצים"]];
  const cur = tab[a.id] || "overview";
  let body;
  if (cur === "overview") {
    body = `<div><h3>מה זה עושה</h3><ul>${a.details.map((x) => `<li>${code(x)}</li>`).join("")}</ul></div>
      ${a.legend.length ? `<div><h3>מקרא</h3><table class="legend">${a.legend.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${code(v)}</td></tr>`).join("")}</table></div>` : ""}
      ${a.howToCheck ? `<div class="check"><h3>איך לבדוק שזה עובד</h3>${code(a.howToCheck)}</div>` : ""}`;
  } else if (cur === "files") {
    body = `<div class="touch"><h3>מה זה משנה במחשב</h3><ul>${a.touches.filter((t) => !t.startsWith("קובץ ")).map((x) => `<li>${code(x)}</li>`).join("") || "<li>רק את הקבצים שלמטה</li>"}</ul></div>
      ${a.files.length ? `<div><h3>קבצים שהוא מתקין</h3><ul class="files">${a.files.map((f) => `<li><span class="ltr">${esc(f.to)}</span>${f.installed ? `<button class="link" data-open="${a.id}" data-file="${f.i}">פתח</button>` : `<span class="tag">לא מותקן</span>`}</li>`).join("")}</ul></div>` : ""}`;
  } else {
    const d = docCache[a.id + "|" + cur];
    body = d ? `<div class="docbar">קובץ: <span class="ltr">${esc(d.path)}</span><button class="link" data-open="${a.id}" data-doc="${esc(cur)}">פתח בעורך</button></div><div class="doc">${md(d.text)}</div>` : "טוען…";
    if (!d) api(`/api/doc`, null, { addon: a.id, doc: cur }).then((r) => { docCache[a.id + "|" + cur] = r; render(); }).catch((e) => { docCache[a.id + "|" + cur] = { text: e.message, path: "" }; render(); });
  }
  return `<div class="tabs">${tabs.map(([id, l]) => `<button data-tab="${a.id}" data-t="${esc(id)}" class="${id === cur ? "on" : ""}">${esc(l)}</button>`).join("")}</div><div class="pane">${body}</div>`;
}

// usage-by-device: one card per machine, fed live by the add-on's own script
let usage = null, usageErr = "", usageStream = null, usageTab = "week";
const ago = (iso) => {
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  return m < 2 ? "עכשיו" : m < 60 ? `לפני ${m} דק׳` : m < 48 * 60 ? `לפני ${Math.round(m / 60)} שע׳` : `לפני ${Math.round(m / 1440)} ימים`;
};
const pct = (x) => `${Math.round(x * 100)}%`;
const uColor = (id) => `var(--u${([...usage.devices].map((d) => d.id).sort().indexOf(id) % 5) + 1})`;
const uMoney = (x) => `<bdi dir="ltr">$${x < 10 ? x.toFixed(2) : Math.round(x)}</bdi>`;
function usagePanel(a) {
  if (!usageStream) {
    usageStream = new EventSource(`/api/panel/stream?${new URLSearchParams({ t: T, addon: a.id })}`);
    usageStream.onmessage = (e) => { usage = JSON.parse(e.data); usageErr = ""; paintUsage(a.id); };
    usageStream.onerror = () => { usageErr = "אין חיבור לתיבת הדואר — מוצג המידע האחרון שנשמר"; paintUsage(a.id); };
  }
  return `<div class="usage" id="usage-${a.id}">${usageBody(a.id)}</div>`;
}
function paintUsage(id) {
  const el = document.getElementById(`usage-${id}`);
  if (el && !el.contains(document.activeElement)) el.innerHTML = usageBody(id); // never repaint under someone typing a name
}
function usageBody(id) {
  if (!usage) return `<div class="u-sub">טוען…</div>`;
  const tabs = [["five", "5 שעות"], ["week", "שבוע"], ["today", "היום"], ["d7", "7 ימים"], ["d30", "30 ימים"], ["month", "החודש"]]
    .filter(([k]) => usage.plan[k] || !["five", "week"].includes(k));
  if (!tabs.some(([k]) => k === usageTab)) usageTab = tabs[0][0];
  const plan = usage.plan[usageTab];
  const stale = (d) => Date.now() - Date.parse(d.updatedAt) > usage.retentionHours * 3600e3;
  return `${usageErr ? `<div class="drift">${esc(usageErr)}</div>` : ""}
    <div class="u-top"><div class="u-seg">${tabs.map(([k, l]) => `<button data-utab="${id}:${k}" class="${k === usageTab ? "on" : ""}">${l}</button>`).join("")}</div>
      ${plan ? `<div class="u-plan">נוצל במנוי: <b>${plan.utilization}%</b></div>` : ""}</div>
    <div class="u-devs">${usage.devices.map((d) => {
      const w = plan ? d.windows[usageTab] : null, p = plan ? null : d.periods[usageTab];
      const big = plan ? `${Math.round(w.pct)}%<small>מהמנוי</small>` : `${pct(p.share)}<small>מהשימוש</small>`;
      const second = plan ? `<b>${pct(w.share)}</b> מהשימוש בפועל` : `${uMoney(p.w)} בערך`;
      const meter = plan ? `<i class="all" style="width:${plan.utilization}%"></i><i style="width:${w.pct}%"></i>` : `<i style="width:${p.share * 100}%"></i>`;
      return `<div class="u-dev ${d.me ? "me" : ""}">
        <div><span class="u-who"><i class="u-dot" style="background:${uColor(d.id)}"></i><input class="u-name" data-dev="${id}:${d.id}" value="${esc(d.name)}" maxlength="40" aria-label="שם המכשיר"></span> ${d.me ? '<span class="tag pending">המחשב הזה</span>' : ""}
          <div class="u-sub ${stale(d) ? "u-stale" : ""}">עודכן ${ago(d.updatedAt)}</div></div>
        <div class="u-end"><div class="u-big">${big}</div><div class="u-sub">${second}</div></div>
        <div class="u-meter">${meter}</div></div>`;
    }).join("")}</div>
    ${usageDaily()}
    <div class="u-foot"><label>שמור עדכונים בתיבת הדואר ל־<input type="number" dir="ltr" min="12" max="168" step="1" data-retention="${id}" value="${usage.retentionHours}"> שעות</label><span>לחץ על שם כדי לשנות אותו</span></div>`;
}
// every day, who used how much: one stacked column per day, 30 days
function usageDaily() {
  const days = usage.daily, max = Math.max(...days.map((d) => d.total));
  if (!max) return "";
  const step = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500].find((x) => x * 4 >= max) ?? Math.ceil(max / 4), top = step * 4;
  const ids = [...usage.devices].map((d) => d.id).sort();
  const label = (day) => { const [, m, d] = day.split("-"); return `${+d}.${+m}`; };
  return `<div class="u-daily"><h3>כל יום, מי השתמש כמה</h3>
    <div class="u-lg">${usage.devices.map((d) => `<span><i class="u-dot" style="background:${uColor(d.id)}"></i> ${esc(d.name)}</span>`).join("")}</div>
    <div class="u-chart"><div class="u-y">${[4, 3, 2, 1, 0].map((k) => `<span>$${step * k}</span>`).join("")}</div>
      <div class="u-plot">${days.map((d, j) => `<div class="u-col" data-uday="${j}" style="height:${(d.total / top) * 100}%">${ids.filter((id) => d.by[id]).map((id) => `<i style="flex:${d.by[id]};background:${uColor(id)}"></i>`).join("")}</div>`).join("")}</div>
      <div class="u-x">${days.map((d, j) => `<span>${j === days.length - 1 ? "היום" : (days.length - 1 - j) % 7 === 0 ? label(d.day) : ""}</span>`).join("")}</div></div></div>`;
}
document.addEventListener("mouseover", (e) => {
  const tip = document.getElementById("u-tip"), col = e.target.closest?.("[data-uday]");
  if (!col || !usage) { tip.style.display = "none"; return; }
  const d = usage.daily[+col.dataset.uday], names = Object.fromEntries(usage.devices.map((x) => [x.id, x.name]));
  const [y, m, dd] = d.day.split("-").map(Number);
  tip.innerHTML = `<b>${new Date(y, m - 1, dd).toLocaleDateString("he-IL", { weekday: "long", day: "numeric", month: "numeric" })}</b> · ${uMoney(d.total)}<br>`
    + (Object.entries(d.by).sort((a, b) => b[1] - a[1]).map(([id, w]) => `<i class="u-dot" style="background:${uColor(id)}"></i> ${esc(names[id] ?? id)}: ${Math.round((w / d.total) * 100)}%`).join("<br>") || "אף אחד לא השתמש");
  const r = col.getBoundingClientRect();
  tip.style.display = "block";
  tip.style.left = `${Math.min(innerWidth - tip.offsetWidth - 8, Math.max(8, r.left + r.width / 2 - tip.offsetWidth / 2))}px`;
  tip.style.top = `${Math.max(8, r.top - tip.offsetHeight - 8)}px`;
});
document.addEventListener("click", (e) => {
  const t = e.target.dataset?.utab;
  if (t) { const [id, k] = t.split(":"); usageTab = k; paintUsage(id); }
});
document.addEventListener("change", async (e) => {
  const n = e.target.dataset?.dev, r = e.target.dataset?.retention;
  if (!n && !r) return;
  const id = n ? n.split(":")[0] : r;
  try {
    if (n) await api("/api/panel/call", { addon: id, cmd: "rename", args: [n.split(":")[1], e.target.value] });
    else await api("/api/panel/call", { addon: id, cmd: "retention", args: [String(e.target.value)] });
    usage = await api("/api/panel", null, { addon: id }); usageErr = "";
  } catch (err) { usageErr = err.message; }
  e.target.blur(); paintUsage(id);
});

// just enough markdown for the add-on docs: headings, lists, tables, code, quotes, emphasis
function md(src) {
  const inline = (t) => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>").replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, l, u) => /^https?:/.test(u) ? `<a href="${u}" target="_blank" rel="noopener">${l}</a>` : l);
  const out = [];
  // a skill's header: its name and the description Claude uses to decide when to fire it
  const fm = src.match(/^---\n([\s\S]*?)\n---\n/);
  if (fm) {
    src = src.slice(fm[0].length);
    const get = (k) => (fm[1].match(new RegExp(`^${k}:\\s*([\\s\\S]*?)(?=\\n[\\w-]+:|$)`, "m")) || [])[1]?.trim();
    const desc = get("description"), when = get("when_to_use");
    if (desc) out.push(`<div class="front"><b>מתי קלוד מפעיל אותו (לפי התיאור שלו)</b><p>${inline(desc)}${when ? " " + inline(when) : ""}</p></div>`);
  }
  const lines = src.replace(/^<\/?div[^>]*>\s*$/gm, "").split("\n");
  for (let i = 0; i < lines.length;) {
    const l = lines[i];
    if (/^```/.test(l)) { const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`); continue; }
    const h = l.match(/^(#{1,4}) (.*)/); if (h) { out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if (/^\|/.test(l)) { const rows = []; while (i < lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = (r) => r.replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      out.push(`<table>${rows.filter((r) => !/^\|[\s:|-]+\|$/.test(r)).map((r, n) => `<tr>${cells(r).map((c) => n ? `<td>${inline(c)}</td>` : `<th>${inline(c)}</th>`).join("")}</tr>`).join("")}</table>`); continue; }
    if (/^\s*([-*]|\d+\.) /.test(l)) { const tag = /^\s*\d/.test(l) ? "ol" : "ul"; const items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.) /.test(lines[i])) { let it = lines[i++].replace(/^\s*([-*]|\d+\.) /, ""); while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*]|\d+\.) /.test(lines[i])) it += " " + lines[i++].trim(); items.push(`<li>${inline(it)}</li>`); }
      out.push(`<${tag}>${items.join("")}</${tag}>`); continue; }
    if (/^> /.test(l)) { const buf = []; while (i < lines.length && /^> ?/.test(lines[i])) buf.push(lines[i++].replace(/^> ?/, "")); out.push(`<blockquote>${inline(buf.join(" "))}</blockquote>`); continue; }
    if (!l.trim() || /^---+$/.test(l)) { i++; continue; }
    const buf = []; while (i < lines.length && lines[i].trim() && !/^(#|```|\||>|\s*([-*]|\d+\.) )/.test(lines[i])) buf.push(lines[i++]);
    out.push(`<p>${inline(buf.join(" "))}</p>`);
  }
  return out.join("");
}

function render() {
  const byId = Object.fromEntries(saved.map((a) => [a.id, a]));
  const changed = new Set(dirty());
  $("#list").innerHTML = GROUPS.map((g) => {
    const items = saved.filter((a) => a.group === g);
    return items.length ? `<h2>${g}</h2>${items.map((a) => card(a, byId, changed)).join("")}` : "";
  }).join("");
  const on = saved.filter((a) => !a.required && a.on).length, total = saved.filter((a) => !a.required).length;
  $("#count").textContent = `${on} מתוך ${total} תוספים פעילים במחשב הזה. שינוי נשמר רק אחרי "שמור", ואחרי שראית מה בדיוק ישתנה.`;
  $("#msg").textContent = changed.size ? `${changed.size} שינויים שלא נשמרו` : "אין שינויים";
  $("#save").disabled = $("#reset").disabled = !changed.size;
}

document.addEventListener("toggle", (e) => { if (e.target.dataset?.id) e.target.open ? open.add(e.target.dataset.id) : open.delete(e.target.dataset.id); }, true);
document.addEventListener("change", (e) => {
  const on = e.target.dataset.on, set = e.target.dataset.set;
  if (on) {
    draft[on].on = e.target.checked;
    // keep dependencies consistent instead of letting the save fail
    const me = saved.find((x) => x.id === on);
    for (const a of saved) {
      if (e.target.checked && me.requires.includes(a.id)) draft[a.id].on = true;
      if (!e.target.checked && a.requires.includes(on)) draft[a.id].on = false;
    }
  }
  if (set) { const [id, key] = set.split(":"); draft[id].settings[key] = e.target.type === "checkbox" ? e.target.checked : e.target.value.trim(); }
  cancelConfirm(); render();
});
document.addEventListener("click", async (e) => {
  const ds = e.target.dataset || {};
  if (ds.tab) { tab[ds.tab] = ds.t; render(); return; }
  if (ds.open) {
    try { await api("/api/open", ds.doc ? { addon: ds.open, doc: ds.doc } : { addon: ds.open, file: Number(ds.file) }); e.target.textContent = "נפתח ✓"; }
    catch (err) { e.target.textContent = err.message; }
    return;
  }
  const act = ds.action;
  if (!act) return;
  const [addon, action] = act.split(":");
  const out = document.querySelector(`[data-out="${act}"]`);
  e.target.disabled = true; out.textContent = "שולח…";
  try { await api("/api/action", { addon, action }); out.innerHTML = '<span class="ok">נשלח ✓</span>'; }
  catch (err) { out.innerHTML = `<span class="bad">${esc(err.message)}</span>`; }
  e.target.disabled = false;
});

const payload = (dryRun) => ({
  enabled: Object.fromEntries(Object.entries(draft).map(([id, d]) => [id, d.on])),
  settings: Object.fromEntries(Object.entries(draft).map(([id, d]) => [id, d.settings])), dryRun,
});
const ACT = { create: "ייווצר", update: "ישתנה", remove: "יימחק" }, DONE = { create: "נוצר", update: "שונה", remove: "נמחק" };
function describe(r, dry) {
  const L = [];
  for (const c of r.changes) L.push(`${(dry ? ACT : DONE)[c.action]}  ${c.file}${c.note ? "  (" + c.note + ")" : ""}`);
  for (const x of r.ran) L.push(`${x.planned ? "יורץ" : x.ok ? "הורץ ✓" : "נכשל ✗"}  ${x.id}${x.error ? ": " + x.error : ""}`);
  for (const n of r.notes) L.push("הערה: " + n);
  if (r.backup) L.push("גיבוי של כל מה ששונה: " + r.backup);
  return L.join("\n") || (dry ? "שום קובץ לא ישתנה" : "הכל כבר מעודכן");
}

let confirming = false;
function cancelConfirm() { if (confirming) { confirming = false; $("#save").textContent = "שמור"; $("#result").style.display = "none"; } }
$("#save").onclick = async () => {
  const box = $("#result");
  box.style.display = "block";
  $("#save").disabled = true;
  try {
    if (!confirming) {
      const r = await api("/api/apply", payload(true));
      box.innerHTML = `<b>זה מה שישתנה. לחץ "אשר" כדי לבצע.</b><pre>${esc(describe(r, true))}</pre>`;
      confirming = true; $("#save").textContent = "אשר"; $("#save").disabled = false;
      return;
    }
    const r = await api("/api/apply", payload(false));
    saved = r.state; draft = snapshot(saved);
    const failed = r.ran.some((x) => !x.ok);
    box.innerHTML = `<b class="${failed ? "bad" : "ok"}">${failed ? "נשמר, חוץ ממה שנכשל למטה" : "נשמר ✓"}</b> טרמינל חדש יטען את השינויים.<pre>${esc(describe(r, false))}</pre>`;
  } catch (err) {
    box.innerHTML = `<b class="bad">לא נשמר, ושום קובץ לא שונה:</b><pre>${esc(err.message)}</pre>`;
  }
  confirming = false; $("#save").textContent = "שמור"; render();
};
$("#reset").onclick = () => { draft = snapshot(saved); cancelConfirm(); render(); };

api("/api/state").then((s) => { saved = s; draft = snapshot(s); render(); })
  .catch((e) => { $("#list").innerHTML = `<p class="bad">${esc(e.message)}</p>`; });
</script>
</body>
</html>
